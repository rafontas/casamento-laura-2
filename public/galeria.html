<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria | Laura &amp; João Vitor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>

  <!-- HEADER / NAV -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="index.html#inicio" class="logo" aria-label="Laura e João Vitor">
        <span class="logo__mark">J&amp;L</span>
      </a>

      <nav class="nav" id="nav">
        <a href="index.html#inicio" class="nav__link">Início</a>
        <a href="historia.html" class="nav__link">Nossa História</a>
        <a href="galeria.html" class="nav__link is-active">Galeria</a>
        <a href="musica.html" class="nav__link">Sugestão de Música</a>
        <a href="presentes.html" class="nav__link">Presentes</a>
        <a href="index.html#rsvp" class="nav__link">RSVP</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>

    <!-- GALERIA -->
    <section class="gallery" id="galeria">
      <div class="container">
        <div class="story__header">
          <p class="eyebrow">Alguns momentos</p>
          <h2 class="section-title">Galeria de Fotos</h2>
          <div class="rule" aria-hidden="true"></div>
          <p class="story__intro">
            Um recorte de momentos nossos pelo caminho até aqui.
          </p>
        </div>

        <div class="gallery__grid" id="galleryGrid"></div>
        <div class="gallery__sentinel" id="gallerySentinel" aria-hidden="true"></div>
        <p class="gallery__empty" id="galleryEmpty" hidden>Em breve, mais fotos por aqui!</p>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__social">
        <a href="https://www.instagram.com/lauraxavis/" target="_blank" rel="noopener noreferrer" class="footer__icon" aria-label="Instagram">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        </a>
        <a href="#" class="footer__icon" aria-label="E-mail">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        </a>
        <button type="button" class="footer__icon" id="avengersEgg" aria-label="Avengers" aria-pressed="false">
          <img width="20" height="20" src="assets/images/easter-eggs/avengers.svg?v=4" alt="Avengers">
        </button>
      </div>
      <p class="footer__names">Laura &amp; João Vitor · 19.06.2027</p>
    </div>
  </footer>

  <!-- LIGHTBOX: GALERIA -->
  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lightbox__backdrop" aria-label="Fechar"></button>
    <button type="button" class="lightbox__close" id="lightboxClose" aria-label="Fechar">&times;</button>
    <button type="button" class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Foto anterior">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button type="button" class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Próxima foto">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <figure class="lightbox__content">
      <img id="lightboxImg" src="" alt="">
    </figure>
  </div>

  <!-- EASTER EGG: AVENGERS -->
  <div class="easter-egg" id="avengersOverlay" hidden>
    <button type="button" class="easter-egg__backdrop" aria-label="Fechar"></button>
    <figure class="easter-egg__content">
      <img
        src="assets/images/easter-eggs/jota-mais-capitao-america.jpeg?v=4"
        alt="João Vitor como Capitão América"
        class="easter-egg__image"
      >
    </figure>
  </div>
  <audio id="avengersAudio" src="assets/musics/avengers_assemble_cap.mp3?v=4" preload="auto"></audio>

  <!-- MÚSICA DE FUNDO -->
  <audio id="bgMusic" src="assets/musics/maria_gadu_amor_de_indio.mp3?v=4" loop preload="auto"></audio>
  <button type="button" class="music-toggle" id="musicToggle" aria-label="Pausar música" aria-pressed="true">
    <svg class="music-toggle__icon music-toggle__icon--on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z"/>
      <path d="M16.5 8.5a5 5 0 0 1 0 7"/>
      <path d="M19 6a9 9 0 0 1 0 12"/>
    </svg>
    <svg class="music-toggle__icon music-toggle__icon--off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" hidden>
      <path d="M4 9v6h4l5 4V5L8 9H4z"/>
      <path d="M15.5 9.5l5 5"/>
      <path d="M20.5 9.5l-5 5"/>
    </svg>
  </button>

  <script src="script.js?v=13"></script>
</body>
</html>
